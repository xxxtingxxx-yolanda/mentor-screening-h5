<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="导师筛选 H5：学生画像填写、后台隐形评分、导师推荐与直投。">
  <title>导师筛选 H5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <span class="logo-dot"></span>
      <div>
        <h1>导师筛选 H5</h1>
        <p>移动端优先 · 隐形评分 · 精准分流</p>
      </div>
    </div>
    <p class="header-note">评分仅用于推荐分流，结果以学院官方信息为准。</p>
  </header>

  <main class="app-shell">
    <section class="panel form-panel" aria-label="学生画像填写">
      <h2>1. 学生画像</h2>
      <p class="muted">尽量点选，不用长篇填写。系统会按你的选择在后台完成匹配评分。</p>

      <form id="profileForm" novalidate>
        <label>目标方向（必选，可多选）</label>
        <div class="chip-row selectable" id="targetDirectionChips">
          <button type="button" class="chip" data-value="包装设计">包装设计</button>
          <button type="button" class="chip" data-value="传达与媒体设计">传达与媒体设计</button>
          <button type="button" class="chip" data-value="产品设计">产品设计</button>
          <button type="button" class="chip" data-value="环境设计">环境设计</button>
          <button type="button" class="chip" data-value="设计历史与理论">设计历史与理论</button>
          <button type="button" class="chip" data-value="智能包装设计与技术">智能包装设计与技术</button>
          <button type="button" class="chip" data-value="乡村振兴与生态设计">乡村振兴与生态设计</button>
        </div>
        <input id="targetDirection" name="targetDirection" type="hidden" required>
        <input id="targetDirectionExtra" name="targetDirectionExtra" type="text" maxlength="80" placeholder="方向补充（可选）">

        <label>已掌握技能（必选，可多选）</label>
        <div class="chip-row selectable" id="currentSkillsChips">
          <button type="button" class="chip" data-value="品牌策划">品牌策划</button>
          <button type="button" class="chip" data-value="视觉设计">视觉设计</button>
          <button type="button" class="chip" data-value="包装结构">包装结构</button>
          <button type="button" class="chip" data-value="材料工艺">材料工艺</button>
          <button type="button" class="chip" data-value="交互设计">交互设计</button>
          <button type="button" class="chip" data-value="用户研究">用户研究</button>
          <button type="button" class="chip" data-value="产品建模">产品建模</button>
          <button type="button" class="chip" data-value="动画与影像">动画与影像</button>
          <button type="button" class="chip" data-value="空间设计">空间设计</button>
          <button type="button" class="chip" data-value="设计史论">设计史论</button>
          <button type="button" class="chip" data-value="项目管理">项目管理</button>
          <button type="button" class="chip" data-value="AI创作工具">AI创作工具</button>
        </div>
        <input id="currentSkills" name="currentSkills" type="hidden" required>
        <input id="currentSkillsExtra" name="currentSkillsExtra" type="text" maxlength="100" placeholder="技能补充（可选）">

        <label>未来职业规划（必选，可多选）</label>
        <div class="chip-row selectable" id="careerPlanChips">
          <button type="button" class="chip" data-value="企业产品设计">企业产品设计</button>
          <button type="button" class="chip" data-value="品牌与包装设计">品牌与包装设计</button>
          <button type="button" class="chip" data-value="数字媒体与交互">数字媒体与交互</button>
          <button type="button" class="chip" data-value="环境与空间设计">环境与空间设计</button>
          <button type="button" class="chip" data-value="文旅与乡村振兴">文旅与乡村振兴</button>
          <button type="button" class="chip" data-value="高校/科研机构">高校/科研机构</button>
          <button type="button" class="chip" data-value="继续攻读博士">继续攻读博士</button>
          <button type="button" class="chip" data-value="创业与设计服务">创业与设计服务</button>
          <button type="button" class="chip" data-value="跨学科创新">跨学科创新</button>
        </div>
        <input id="careerPlan" name="careerPlan" type="hidden" required>
        <input id="careerPlanExtra" name="careerPlanExtra" type="text" maxlength="100" placeholder="职业规划补充（可选）">

        <label class="checkbox-wrap">
          <input id="privacyConsent" type="checkbox" required>
          <span>我同意将填写信息用于导师匹配与投递处理。</span>
        </label>

        <div class="action-row">
          <button type="submit" id="analyzeBtn">生成推荐</button>
          <button type="button" id="resetBtn" class="ghost">重置</button>
        </div>
        <p id="formMsg" class="form-msg" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel result-panel" aria-label="推荐结果">
      <div class="result-head">
        <h2>2. 推荐结果</h2>
        <div class="result-count" id="resultCount">尚未生成</div>
      </div>
      <p class="muted">系统将综合你的方向、技能和职业规划进行智能匹配分析。</p>

      <div class="toolbar">
        <label for="directionFilter">方向筛选</label>
        <select id="directionFilter">
          <option value="">全部方向</option>
        </select>
        <label for="keywordFilter">关键词</label>
        <input id="keywordFilter" type="search" placeholder="按姓名/研究方向搜索">
      </div>

      <div id="mentorList" class="mentor-list" aria-live="polite"></div>
    </section>
  </main>

  <section class="detail-drawer" id="detailDrawer" aria-label="导师详情" hidden>
    <button class="drawer-close" id="closeDetailBtn" type="button" aria-label="关闭详情">×</button>
    <div id="detailContent"></div>
  </section>

  <template id="mentorCardTemplate">
    <article class="mentor-card">
      <img class="mentor-photo" alt="">
      <div class="mentor-main">
        <div class="mentor-title-row">
          <h3 class="mentor-name"></h3>
        </div>
        <p class="mentor-meta"></p>
        <p class="mentor-research"></p>
        <div class="mentor-actions">
          <button type="button" class="detail-btn">查看详情</button>
          <button type="button" class="contact-btn"></button>
        </div>
      </div>
    </article>
  </template>

  <script src="data/mentors.inline.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
